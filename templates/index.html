<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>سامانه تولید نامه PDF</title>
  <style>
    @font-face{font-family:IRANSans;src:url('/assets/IRANSansWeb(FaNum).ttf') format('truetype');font-display:swap}
    *{box-sizing:border-box}
    body{margin:0;background:#f4f6f8;color:#202733;font-family:IRANSans,Tahoma,sans-serif;min-height:100vh;display:grid;place-items:center;padding:22px}
    .card{width:min(100%,510px);background:#fff;border:1px solid #e4e8ed;border-radius:18px;padding:30px;box-shadow:0 12px 36px #14243a0c}
    .brand{display:flex;align-items:center;gap:12px;margin-bottom:24px}
    .mark{width:44px;height:44px;border-radius:13px;background:#eaf2fb;color:#1c5d91;display:grid;place-items:center;font-size:23px}
    h1{font-size:21px;margin:0 0 5px}
    .sub{font-size:13px;color:#697586;margin:0;line-height:1.9}
    label{display:block;font-size:14px;font-weight:700;margin:19px 0 8px}
    input{width:100%;height:50px;border:1px solid #d8dee7;border-radius:10px;padding:0 14px;font:inherit;font-size:14px;outline:none;background:#fff}
    input:focus{border-color:#397bb5;box-shadow:0 0 0 3px #397bb51a}
    .hint{font-size:12px;color:#7a8492;margin-top:7px;min-height:20px}
    .hint.error{color:#bd3434}.hint.ok{color:#21834b}
    button{width:100%;height:50px;border:0;border-radius:10px;background:#1d659f;color:white;font:inherit;font-weight:700;font-size:14px;margin-top:18px;cursor:pointer}
    button:disabled{background:#aab6c2;cursor:not-allowed}
    .privacy{font-size:11px;color:#7b8491;line-height:1.9;text-align:center;margin:18px 0 0}
    .status{display:none;margin-top:15px;padding:11px 13px;border-radius:9px;font-size:13px;line-height:1.8}
    .status.error{display:block;background:#fff0f0;color:#a52c2c}
    .status.info{display:block;background:#edf6ff;color:#225d8d}
    @media(max-width:480px){.card{padding:22px}.brand{margin-bottom:18px}}
  </style>
</head>
<body>
<main class="card">
  <header class="brand">
    <div class="mark">▤</div>
    <div>
      <h1>سامانه تولید نامه PDF</h1>
      <p class="sub">اطلاعات خود را وارد کنید تا نامه اختصاصی شما ساخته شود.</p>
    </div>
  </header>

  <form id="letterForm">
    <label for="fullName">نام و نام خانوادگی</label>
    <input id="fullName" name="full_name" type="text" maxlength="80" autocomplete="name"
           placeholder="مثلاً محمد رحیمی" required>

    <label for="nationalId">شماره ملی (دقیقاً ۱۰ رقم)</label>
    <input id="nationalId" name="national_id" type="text" inputmode="numeric"
           autocomplete="off" maxlength="10" minlength="10" pattern="[0-9۰-۹]{10}"
           placeholder="شماره ملی را وارد کنید" required>
    <div id="idHint" class="hint">شماره ملی باید دقیقاً ۱۰ رقم باشد.</div>

    <button id="submitBtn" type="submit" disabled>تولید و دریافت PDF</button>
    <div id="status" class="status" role="status" aria-live="polite"></div>
  </form>
  <p class="privacy">تاریخ در زمان تولید به شمسی درج می‌شود. اطلاعات واردشده برای ساخت نامه استفاده می‌شود و در پایگاه داده ذخیره نمی‌شود.</p>
</main>

<script>
const form=document.getElementById('letterForm');
const nameInput=document.getElementById('fullName');
const idInput=document.getElementById('nationalId');
const btn=document.getElementById('submitBtn');
const hint=document.getElementById('idHint');
const statusBox=document.getElementById('status');
const digitPattern=/^[0-9۰-۹]{10}$/;

idInput.addEventListener('input',()=>{
  // فقط رقم نگه می‌داریم و اجازه عبور از ۱۰ نویسه نمی‌دهیم.
  idInput.value=Array.from(idInput.value).filter(c=>/[0-9۰-۹]/.test(c)).slice(0,10).join('');
  const ok=digitPattern.test(idInput.value);
  btn.disabled=!(nameInput.value.trim().length>0 && ok);
  hint.textContent=ok?'شماره ملی از نظر تعداد ارقام صحیح است.':'شماره ملی باید دقیقاً ۱۰ رقم باشد.';
  hint.className='hint '+(ok?'ok':(idInput.value.length?'error':''));
});
nameInput.addEventListener('input',()=>{
  btn.disabled=!(nameInput.value.trim().length>0 && digitPattern.test(idInput.value));
});

form.addEventListener('submit',async(e)=>{
  e.preventDefault();
  if(btn.disabled)return;
  statusBox.className='status info';
  statusBox.textContent='در حال تولید نامه؛ لطفاً چند لحظه صبر کنید...';
  btn.disabled=true;
  try{
    const response=await fetch('/generate',{method:'POST',body:new FormData(form)});
    if(!response.ok){
      const msg=await response.text();
      throw new Error(msg || 'ساخت فایل با خطا مواجه شد.');
    }
    const blob=await response.blob();
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url;
    a.download='letter.pdf';
    document.body.appendChild(a);a.click();a.remove();
    URL.revokeObjectURL(url);
    statusBox.className='status info';
    statusBox.textContent='نامه آماده شد و دانلود آن آغاز شد.';
  }catch(err){
    statusBox.className='status error';
    statusBox.textContent=err.message || 'ارتباط با سرور برقرار نشد.';
  }finally{
    btn.disabled=!(nameInput.value.trim().length>0 && digitPattern.test(idInput.value));
  }
});
</script>
</body>
</html>
